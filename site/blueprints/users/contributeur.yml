title: Contributeur
description: Peut créer des projets et rapports en brouillon

permissions:
  access:
    panel: true
    site: true
    users: false
    system: false
  site:
    update: false
  pages:
    create: true
    changeSlug: true
    changeStatus: false
    changeTitle: true
    delete: true
    update: true
    sort: false
  files:
    create: false
    changeName: false
    delete: false
    update: false
    sort: false
  users:
    create: false
    changeEmail: false
    changeLanguage: false
    changeName: false
    changePassword: false
    changeRole: false
    delete: false
    update: false
  user:
    changeEmail: true
    changeLanguage: true
    changeName: true
    changePassword: true
    update: true
    delete: false

columns:
  - width: 1/2
    fields:
      street:
        label: Street
        type: text
      zip:
        label: ZIP
        type: text
        width: 1/4
      city:
        label: City
        type: text
        width: 3/4
      country:
        label: Country
        type: text
  - width: 1/2
    fields:
      website:
        label: Website
        type: url
      fediverse:
        label: Fediverse
        type: text
      instagram:
        label: Instagram
        type: text
