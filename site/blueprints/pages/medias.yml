  changeSlug: false
  delete: false
  changeTitle:
    "*": true
    contributeur: false
  changeStatus: false
  preview: "https://modus-ge.ch/{{ page.slug }}"
  update:
    contributeur: false
  duplicate:
    contributeur: false
  move:
    contributeur: false

columns:
  - width: 1/1
    fields:
      content:
        extends: fields/body
        fields:
          headerImage:
            required: true
          body: false
          preview:
            label: Brève description
  - width: 1/1
    sections:
      pages:
        layout: cards
        cover: true
        sortBy: dateStart desc
        sortable: false
        type: pages
        create: media
        search: true
        limit: 500
        templates:
          - media
