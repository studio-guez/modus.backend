title: Power BI

status:
  listed: true
  draft: true

options:
  access:
    contributeur: false
  changeSlug:
    "*": true
    contributeur: false
  delete:
    "*": true
    contributeur: false
  changeTitle:
    "*": true
    contributeur: false
  changeStatus:
    "*": true
    contributeur: false
  preview: "https://modus-ge.ch/project/{{ page.parent.slug }}/{{ page.slug }}"
  update:
    contributeur: false
  create:
    contributeur: false
  duplicate:
    contributeur: false
  move:
    contributeur: false

sections:
  fields:
    type: fields
    fields:
      power_bi_link:
        type: url
        required: true

      power_bi_pages:
        type: structure
        fields:
          image:
            label: Icon
            min: 0
            max: 1
            type: files
            layout: cards
            uploads:
              template: image

          power_bi_pages_number:
            label: Chiffre mis en avant
            type: text
            inline: true
            marks: false


          power_bi_pages_title:
            label: Titre
            type: text
            required: false

          power_bi_pages_description:
            label: Description
            type: writer
            inline: true
            marks:
              - bold
              - italic
              - underline
              - strike

          power_bi_pages_link:
            label: Lien vers une page
            type: url
