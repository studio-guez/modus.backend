title: modus

options:
  preview: https://modus-ge.ch/

tabs:
  # Content tab (existing structure)
  content:
    label: Contenu
    columns:
      - width: 1/3
        fields:
          files:
            label:
              fr: Fichiers
            type: files
            layout: small
            uploads:
              template: pdf

      - width: 2/3
        sections:
          tags:
            label: "Tags"
            type: pages
            status: listed
            image: false
            templates: tags
            layout: cards
            size: medium

          pages:
            image: false
            type: pages
            create: default
            templates:
              - home
              - default
              - default-admin
              - projects
              - outils-modus
              - library
              - medias
              - toolkit

  # Navigation tab (new)
  navigation:
    label: Navigation
    columns:
      - width: 1/2
        fields:
          topMenu:
            extends: fields/menuitem
            label: Menu haut (1 niveau)
            help: "Menu affiché en haut de page"

          mainMenu:
            extends: fields/menuitem-with-children
            label: Menu principal (2 niveaux)
            help: "Menu principal avec sous-menus"

      - width: 1/2
        fields:
          bottomMenu:
            extends: fields/menuitem
            label: Menu bas (1 niveau)
            help: "Menu affiché en bas de page"

          footerMenu:
            extends: fields/menuitem
            label: Menu footer (1 niveau)
            help: "Menu du pied de page"

  # Actualités tab
  actualites:
    label: Bandeaux actualité
    columns:
      - width: 1/1
        fields:
          actualite1title:
            label: Actualité 1 - Titre
            type: text
            width: 1/3
          actualite1link:
            label: Actualité 1 - Lien (optionnel)
            type: url
            width: 1/3
          actualite1color:
            label: Actualité 1 - Couleur
            type: select
            width: 1/3
            empty: false
            default: teal
            options:
              main-dark: Vert foncé
              main: Vert clair
              sage: Vert sauge
              teal: Vert sarcelle
          actualite2title:
            label: Actualité 2 - Titre
            type: text
            width: 1/3
          actualite2link:
            label: Actualité 2 - Lien (optionnel)
            type: url
            width: 1/3
          actualite2color:
            label: Actualité 2 - Couleur
            type: select
            width: 1/3
            empty: false
            default: sage
            options:
              main-dark: Vert foncé
              main: Vert clair
              sage: Vert sauge
              teal: Vert sarcelle
