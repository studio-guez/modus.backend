name: field.blocks.image.name
icon: image
preview: fields
wysiwyg: true
fields:
  id:
    type: unique-shortcode
    label: Shortcode
    prefix: figure
    width: 1
  image:
    label: field.blocks.image.name
    type: files
    query: site.images
    multiple: false
    required: true
    image:
      back: black
    uploads:
      template: blocks/image
  size:
    label: Taille
    type: select
    width: 1/2
    default: large
    required: true
    options:
      full: Pleine largeur
      large: Grande
      medium: Moyenne
      small: Petite
  alignment:
    label: Alignement
    type: select
    width: 1/2
    default: left
    required: true
    options:
      left: Gauche
      center: Centre
      right: Droite
  alt:
    label: field.blocks.image.alt
    type: text
    icon: title
  caption:
    label: field.blocks.image.caption
    type: writer
    icon: text
    inline: true
    buttons:
      - bold
      - italic
      - underline
      - strike
      - link
