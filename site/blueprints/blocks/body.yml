title: Texte courant

icon: text
wysiwyg: true
preview: fields
fields:
  text:
    label: false
    type: writer
    marks:
      - bold
      - italic
      - underline
      - strike
      - link
    headings:
      - 2
      - 3
      - 4
      - 5
      - 6
    nodes:
      - paragraph
      - bulletList
      - orderedList
      - heading
    placeholder: field.blocks.text.placeholder
  alignment:
    label: Alignement du texte
    type: select
    default: left
    options:
      left: Gauche
      center: Centre
      right: Droite
      justify: Justifié
